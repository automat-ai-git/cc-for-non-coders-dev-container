# Локальный тестовый экземпляр — один контейнер
#
# Запуск:  ./run.sh
# Или:     docker compose up --build
#
# Портал: http://localhost:8989  (пароль из .env)

services:
  student:
    build: .
    container_name: claude-code
    group_add:
      - "${DOCKER_GID:-1001}"
      - "2000"
    environment:
      # Пробрасываем HOST_HOME внутрь: контейнер имеет docker.sock и может
      # порождать sibling-контейнеры — агенту нужен host-путь для трансляции
      # bind-маунтов (их интерпретирует хостовый демон, не ФС контейнера).
      - HOST_HOME=${HOST_HOME}
      - TG_DAEMON_SOCKET=/tmp/tg-socket/tg-cli.sock
      - PASSWORD=${PASSWORD:-student-2026}
      - ANTHROPIC_AUTH_TOKEN=${GLM_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}
      - GLM_OPUS_MODEL=${GLM_OPUS_MODEL:-GLM-5.2}
      - GLM_SONNET_MODEL=${GLM_SONNET_MODEL:-GLM-5.1}
      - GLM_HAIKU_MODEL=${GLM_HAIKU_MODEL:-GLM-4.7}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-3000000}
      - ANTHROPIC_AUTH_TOKEN_BACKUP=${GLM_API_KEY_BACKUP:-}
      # [ЛЕГАСИ] OLLAMA_MODEL больше не используется — модель задаётся аргументом
      # `~/switch-model.sh ollama <модель>`. Осталось от старой схемы с LiteLLM.
      # Оставлено закомментированным для истории.
      # - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen36-pro-128k:latest}
      - LMSTUDIO_URL=${LMSTUDIO_URL:-http://lmstudio:8080}
      - SEARXNG_URL=${SEARXNG_URL:-}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG:-}
      - PLANE_BASE_URL=${PLANE_BASE_URL:-}
    ports:
      - "8989:8080"
    volumes:
      # Абсолютные пути, привязанные к ${HOST_HOME}, а НЕ относительные ./ —
      # иначе при пересоздании контейнера из чужого cwd (через агента-мост)
      # docker создаёт фантомные пустые папки, и навыки/состояние в .claude теряются.
      - ${HOST_HOME}/cc-for-non-coders-dev-container/student-data:/home/coder/course
      - ${HOST_HOME}/cc-for-non-coders-dev-container/claude-config:/home/coder/.claude
      - ${HOST_HOME}:/home/coder/home:ro
      - ${HOST_HOME}/workspace:/home/coder/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MEETING_DATA_DIR:-${HOST_HOME}/cc-for-non-coders-dev-container/meeting-data}:/meeting-data:ro
      - tg_socket_data:/tmp/tg-socket   # общий Unix-сокет tg-cli daemon (volume tg-cli_tg_socket_data)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - localai_default
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  localai_default:
    external: true

volumes:
  tg_socket_data:
    external: true
    name: tg-cli_tg_socket_data
