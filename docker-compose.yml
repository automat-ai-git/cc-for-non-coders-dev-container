# Локальный тестовый экземпляр — один контейнер
#
# Запуск:  ./run.sh
# Или:     docker compose up --build
#
# Портал: http://localhost:8989  (пароль из .env)

services:
  student:
    build: .
    container_name: claude-code
    environment:
      - PASSWORD=${PASSWORD:-student-2026}
      - ANTHROPIC_AUTH_TOKEN=${GLM_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.z.ai/api/anthropic}
      - GLM_OPUS_MODEL=${GLM_OPUS_MODEL:-GLM-5.1}
      - GLM_SONNET_MODEL=${GLM_SONNET_MODEL:-GLM-4.7}
      - GLM_HAIKU_MODEL=${GLM_HAIKU_MODEL:-GLM-4.5-Air}
      - API_TIMEOUT_MS=${API_TIMEOUT_MS:-3000000}
      - ANTHROPIC_AUTH_TOKEN_BACKUP=${GLM_API_KEY_BACKUP:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen36-pro-128k:latest}
      - PLANE_API_KEY=${PLANE_API_KEY:-}
      - PLANE_WORKSPACE_SLUG=${PLANE_WORKSPACE_SLUG:-}
      - PLANE_BASE_URL=${PLANE_BASE_URL:-}
    ports:
      - "8989:8080"
    volumes:
      - student-data:/home/coder/course
      - /home/your-user/workspace:/home/coder/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - localai_default
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  student-data:

networks:
  localai_default:
    external: true
